$kind: http-request
url: "{{BASE_URL}}/posts"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Has posts array', () => pm.expect(r.posts).to.be.an('array'));
      pm.test('Has total', () => pm.expect(r.total).to.be.a('number'));
      if (r.posts.length > 0) {
        pm.collectionVariables.set('POST_ID', r.posts[0]._id);
        console.log('POST_ID set to:', r.posts[0]._id);
      }
    language: text/javascript
order: 1000
