    ═══════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Breathe",
      "url": "https://breatheonline.app",
      "description": "Guided breathing exercises for sleep, stress relief, and focus. Includes Box Breathing, 4-7-8, Wim Hof Method, and AI coaching.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Guided breathing sessions",
        "AI breathing coach",
        "Sleep sounds",
        "Session history tracking",
        "Mood tracking",
        "Community forum"
      ],
      "screenshot": "https://breatheonline.app/og-image.webp"
    }
    </script>

    <!-- FAQ structured data — helps appear in Google's rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is box breathing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Box breathing is a technique where you inhale for 4 seconds, hold for 4, exhale for 4, and hold again for 4. It reduces stress and improves focus."
          }
        },
        {
          "@type": "Question",
          "name": "How does 4-7-8 breathing help sleep?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 4-7-8 technique involves inhaling for 4 seconds, holding for 7, and exhaling for 8. The long exhale activates the parasympathetic nervous system, reducing heart rate and helping you fall asleep faster."
          }
        },
        {
          "@type": "Question",
          "name": "Is guided breathing free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Breathe is free to use with no download required. It works directly in your browser on any device."
          }
        }
      ]
    }
    </script>
